[project]
name = "college-scheduler"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.142,<0.143", "uvicorn>=0.54,<0.55", "SQLAlchemy>=2.1,<2.2",
  "alembic>=1.20,<1.21", "psycopg[binary]>=3.3,<3.4", "pydantic-settings>=2.15,<2.16",
  "argon2-cffi>=25.1,<26", "openpyxl>=3.1,<3.2", "ortools>=9.15,<9.16",
  "python-multipart>=0.0.32,<0.1"
]
[project.optional-dependencies]
test = ["pytest>=9,<10", "httpx>=0.28,<0.29"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

