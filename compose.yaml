name: college-scheduler
x-app: &app
  build: .
  image: college-scheduler:local
  restart: unless-stopped
  environment: &environment
    DATABASE_URL: postgresql+psycopg://scheduler:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/scheduler
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    SECURE_COOKIES: ${SECURE_COOKIES:-true}
    BOOTSTRAP_USERS: ${BOOTSTRAP_USERS:?Set four accounts}
    DATA_DIR: /app/data
    SOLVER_SECONDS: ${SOLVER_SECONDS:-30}
    SOLVER_WORKERS: ${SOLVER_WORKERS:-2}
  volumes:
    - uploads:/app/data
  init: true
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: scheduler
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U scheduler -d scheduler']
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 256mb
  web:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
    # Coolify routes HTTPS to port 8000. No public DB or web port required.
    expose: ["8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=4)"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5
  worker:
    <<: *app
    command: [python, -m, app.worker]
    environment:
      <<: *environment
      BOOTSTRAP_USERS: ""
    depends_on:
      web:
        condition: service_healthy
    # The image's HTTP healthcheck does not apply to a worker.
    healthcheck:
      disable: true
    mem_limit: 2g
    cpus: 2
volumes:
  postgres:
  uploads:
