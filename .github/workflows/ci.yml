name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: college_scheduler_test
          POSTGRES_USER: scheduler
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd 'pg_isready -U scheduler -d college_scheduler_test'
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://scheduler:test-only-password@localhost:5432/college_scheduler_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: pytest -q
      - name: Check database migration matches models
        env:
          DATABASE_URL: postgresql+psycopg://scheduler:test-only-password@localhost:5432/college_scheduler_test
        run: alembic check
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and test Docker startup
        run: |
          python deploy/ci_environment.py
          docker compose -f compose.yaml -f compose.local.yaml up --build -d
          for i in $(seq 1 60); do
            if curl --fail -s http://127.0.0.1:8000/api/health; then break; fi
            sleep 3
          done
          curl --fail http://127.0.0.1:8000/api/health
          docker compose exec -T web python -c "from app.db import SessionLocal,User; from sqlalchemy import select; d=SessionLocal(); assert len(d.scalars(select(User)).all())==4"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Browser flows with anonymous demo data
        run: |
          docker compose exec -T web python -c 'from app.db import SessionLocal,Workspace,Audit; from app.demo import demo_state; from sqlalchemy import select; d=SessionLocal(); raw=demo_state().model_dump(mode="json"); d.get(Workspace,1).payload=raw; d.scalar(select(Audit).where(Audit.version==0)).snapshot=raw; d.commit()'
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: frontend/test-results
      - name: Verify backup and restore
        run: |
          docker compose exec -T web python -c 'from pathlib import Path; Path("/app/data/restore-check.txt").write_text("original")'
          ./deploy/backup.sh
          backup_path=$(find backups -mindepth 1 -maxdepth 1 -type d | head -1)
          docker compose exec -T web python -c 'from app.db import SessionLocal,User; from sqlalchemy import select; from pathlib import Path; d=SessionLocal(); d.delete(d.scalar(select(User).limit(1))); d.commit(); Path("/app/data/restore-check.txt").write_text("modified")'
          ./deploy/restore.sh "$backup_path" --replace-current
          docker compose exec -T web python -c 'from pathlib import Path; assert Path("/app/data/restore-check.txt").read_text()=="original"'
          docker compose exec -T web python -c "from app.db import SessionLocal,User; from sqlalchemy import select; d=SessionLocal(); assert len(d.scalars(select(User)).all())==4"
      - name: Logs
        if: always()
        run: docker compose logs --no-color
      - name: Cleanup
        if: always()
        run: docker compose down -v
